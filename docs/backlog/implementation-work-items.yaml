items:
  - id: VIB-STAB-001
    epic: Stabilization
    title: Document production topology and reproduce core failure
    purpose: Bound the public TLS/custom-domain failure, document the production topology, and determine whether any application failure remains before redesign work.
    specification_references:
      - docs/review/03-technical-audit.md
      - docs/specs/11-migration-and-redesign-plan.md
      - docs/specs/17-observability-reliability.md
      - docs/operations/production-access-ownership.md
    dependencies: []
    likely_files:
      - docs/operations/current-production-topology.md
      - docs/operations/production-access-ownership.md
      - docs/runbooks/core-workspace-unavailable.md
    acceptance_criteria:
      - Current hosting, DNS, build, runtime, Cognito, DynamoDB, S3, and rollback access and ownership are confirmed or recorded with a named escalation request.
      - Standard and certificate-bypassed probes bound the public failure with timestamped evidence; deployment logs are correlated when access exists.
      - The topology and runbook clearly distinguish TLS/custom-domain, platform, route, and AWS dependency failures.
      - No production mutation is made without an approved incident change.
    testing_requirements:
      - Capture redacted HTTP, TLS, DNS, and deployment-log evidence where access exists.
      - Verify home, cards, about, contact, and sign-in-adjacent routes.
    observability_requirements: Record the minimum signals needed to correlate the failing route.
    security_requirements: Redact tokens, cookies, account data, and signed URLs from evidence.
    accessibility_requirements: N/A for diagnosis; verify the user-facing failure remains understandable.
    complexity: M
    estimated_effort: 1-2 days
    suggested_owner: Reliability agent
    branch_name: agent/vib-stab-001-production-baseline
    commit_prefix: "docs(stability):"
    milestone: M0
    status: done

