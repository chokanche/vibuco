name: Baseline CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  reproducible-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm

      - name: Verify pinned npm
        run: |
          npm --version
          test "$(npm --version)" = "11.9.0"

      - name: Install locked dependencies
        run: npm ci

      - name: Validate specifications
        run: bash scripts/validate-specs.sh

      - name: Run stabilization fault tests
        run: npm run test:stability

      - name: Run legacy characterization unit tests
        run: npm run test:legacy:unit

      - name: Install characterization browser
        run: npx playwright install --with-deps chromium

      - name: Run legacy characterization journeys
        run: npm run test:legacy:e2e

      - name: Build legacy application
        run: npm run build

      - name: Reject lockfile drift
        run: git diff --exit-code -- package-lock.json
